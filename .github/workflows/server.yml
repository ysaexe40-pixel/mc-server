name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Server Configuration
        run: |
          mkdir -p server
          cd server
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          
          if [ -d "../mods" ]; then
            mkdir -p mods
            cp -r ../mods/* ./mods/ || true
          fi

      - name: Download Fabric Server 1.21.1
        run: |
          cd server
          curl -JLO "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.0/1.0.1/server/jar"
          mv *.jar server.jar

      - name: Start Playit and Server
        run: |
          curl -sSL https://github.com/playit-cloud/playit-agent/releases/latest/download/playit-linux-amd64 -o playit
          chmod +x playit
          
          # تشغيل playit وتخزين الـ Claim Code فـ ملف
          ./playit secret generate > playit.log 2>&1 &
          
          # انتظار 6 ثواني حتى يتولد الكود
          sleep 6
          
          echo "=========================================="
          cat playit.log
          echo "=========================================="
          
          cd server
          java -Xms2G -Xmx6G -jar server.jar nogui

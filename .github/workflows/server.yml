name: Minecraft Server

on:
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Server Configuration
        run: |
          mkdir -p server
          cd server
          echo "eula=true" > eula.txt
          echo "online-mode=false" > server.properties
          
          if [ -d "../mods" ]; then
            mkdir -p mods
            cp -r ../mods/* ./mods/ || true
          fi

      - name: Download Fabric Server 1.21.1
        run: |
          cd server
          curl -JLO "https://meta.fabricmc.net/v2/versions/loader/1.21.1/0.16.0/1.0.1/server/jar"
          mv *.jar server.jar

      - name: Start Playit Tunnel
        run: |
          # تحميل أحدث برنامج playit-cli
          curl -SsL https://playit-cloud.github.io/playit-agent/install.sh | sudo bash
          
          # تشغيل Playit وطباعة الرابط فـ اللوقس ديريكت
          playit setup-cli > playit.log 2>&1 &
          sleep 6
          
          echo "=========================================="
          cat playit.log | grep -i "claim" || cat playit.log
          echo "=========================================="
          
          cd server
          java -Xms2G -Xmx6G -jar server.jar nogui
